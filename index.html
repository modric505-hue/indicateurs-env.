<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Indicateurs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<title>Indicateurs Worldline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field notebook. Each indicator is a labelled unit tag (L, kWh, kg, km) with its own colour; the unit colours are the only loud thing. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#10213F; --muted:#586884; --line:#DAE0EA;
  --uL:#B45F06; --ukWh:#2551D9; --ukg:#0B8573; --ukm:#7442C8; --unb:#B8336A;
  --good:#17714B; --good-bg:#E3F4EB; --bad:#B42323; --bad-bg:#FBE7E7; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#131F36; --ink:#E8EEF9; --muted:#9AA9C5; --line:#26385C;
    --uL:#FFB454; --ukWh:#8AA8FF; --ukg:#4FD6BF; --ukm:#B997FF; --unb:#FF8FBF;
    --good:#5FD39A; --good-bg:#12302A; --bad:#FF8B8B; --bad-bg:#3A1A22; --warn:#FFC966; --warn-bg:#3A2D10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#131F36; --ink:#E8EEF9; --muted:#9AA9C5; --line:#26385C;
  --uL:#FFB454; --ukWh:#8AA8FF; --ukg:#4FD6BF; --ukm:#B997FF; --unb:#FF8FBF;
  --good:#5FD39A; --good-bg:#12302A; --bad:#FF8B8B; --bad-bg:#3A1A22; --warn:#FFC966; --warn-bg:#3A2D10;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ukWh);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(92px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.gap-s{display:grid;gap:8px}

/* Unit colours */
.u-L{--u:var(--uL)} .u-kWh{--u:var(--ukWh)} .u-kg{--u:var(--ukg)} .u-km{--u:var(--ukm)} .u-nb{--u:var(--unb)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:3px 9px;border-radius:7px;font-family:var(--mono);font-weight:600;font-size:13px;line-height:1.3;color:var(--u);background:color-mix(in srgb,var(--u) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 40%,var(--surface))}
.chip.big{font-size:20px;padding:6px 14px;border-radius:10px}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.ico{width:44px;height:44px;color:var(--ink);--acc:var(--u,var(--ukWh));flex:none}
.a{fill:var(--acc);stroke:none}
.at{fill:var(--acc);fill-opacity:.16}
.ui{width:24px;height:24px;flex:none}

/* Home / header */
.hero h1{font-size:clamp(30px,8.6vw,40px);line-height:1.04;font-weight:800;letter-spacing:-.015em;margin:0 0 8px;font-variation-settings:"opsz" 60}
.hero .lede{color:var(--muted);max-width:42ch}
.unitstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.unitstrip div{padding:12px 6px;border-radius:12px;text-align:center;background:color-mix(in srgb,var(--u) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 35%,var(--surface))}
.unitstrip b{display:block;font-family:var(--mono);font-size:19px;color:var(--u)}
.unitstrip span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.sec{font-family:var(--mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.progress div{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.progress b{font-family:var(--mono);font-size:20px;display:block}
.progress span{font-size:12px;color:var(--muted)}

/* Lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 14px;background:none;border:0;text-align:left}
.item:active{background:var(--bg)}
.item .t{font-family:var(--display);font-weight:700;line-height:1.2}
.item .s{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.item .go{color:var(--muted);width:18px;height:18px}
.item.done .t::after{content:" ✓";color:var(--good)}
.num{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--bg);font-family:var(--mono);font-weight:600}

/* Filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Page header */
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 0;margin-left:-4px;background:none;border:0;font-weight:700;color:var(--muted)}
.back .ui{width:20px;height:20px}
.page h1{font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.01em}
.page .sub{color:var(--muted);margin-top:4px}

/* KPI detail */
.kpihero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--u) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 32%,var(--surface))}
.kpihero .ico{width:96px;height:96px}
.kpihero .meta{display:grid;gap:8px;justify-items:start}
.quote{font-family:var(--display);font-size:19px;line-height:1.3;font-weight:600;text-wrap:pretty}
.blk h2{font-size:13px;font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.blk p{text-wrap:pretty}
.callout{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:14px;border-radius:14px}
.callout.warn{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--surface))}
.callout.warn .ui{color:var(--warn)}
.callout.reflex{background:color-mix(in srgb,var(--ukWh) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--ukWh) 35%,var(--surface))}
.callout.reflex .ui{color:var(--ukWh)}
.callout h3{font-size:14px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:left}
.link .ico{width:28px;height:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.btn:active{transform:scale(.99)}

/* Fake document */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(16,33,63,.35);position:relative;overflow:hidden}
.doc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.doc header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 14px 8px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.doc header em{font-style:normal;border:1px dashed var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 14px;font-family:var(--mono);font-size:13px;border-top:1px dotted var(--line)}
.drow span:first-child{color:var(--muted)}
.drow span:last-child{text-align:right;font-weight:500}
.drow.hi{padding-bottom:22px;background:color-mix(in srgb,var(--u) 13%,var(--surface));border-top:1px solid color-mix(in srgb,var(--u) 40%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--u) 40%,var(--surface));position:relative}
.drow.hi span:last-child{color:var(--u);font-weight:600}
.drow.hi::after{content:"à saisir";position:absolute;right:14px;bottom:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--u);font-family:var(--mono);font-weight:600}
.dnote{padding:10px 14px 12px;font-size:12.5px;color:var(--muted)}
.dpad{height:12px}

/* Lessons */
.lesson{display:grid;gap:16px}
.lesson h2{font-size:21px;line-height:1.15;font-weight:800}
.lesson p{text-wrap:pretty}
.lesson ul,.lesson ol{margin:0;padding-left:20px;display:grid;gap:6px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.fig text{font-family:var(--body);fill:var(--ink)}
.fig .m{font-family:var(--mono)}
.fig .mu{fill:var(--muted)}
.eq{display:grid;gap:8px}
.eq>div{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.eq .op{background:none;border:0;padding:0;text-align:center;font-family:var(--mono);font-size:22px;color:var(--muted);line-height:1}
.eq.key>div:first-child{border-color:var(--ukWh);background:color-mix(in srgb,var(--ukWh) 9%,var(--surface))}
.eq b{font-family:var(--display)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:table}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
.bad{color:var(--bad);font-weight:700}
.ok{color:var(--good);font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:8px!important}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pair .en{font-family:var(--mono);font-weight:600}
.pair .fr{font-family:var(--display);font-weight:800;font-size:18px}
.pair .ar{color:var(--muted);font-size:20px}
.pair .no{grid-column:1/-1;font-size:13px;color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kv b{display:block;font-family:var(--display);font-size:16px}
.kv span{font-size:13px;color:var(--muted)}
.done-row{margin-top:6px}

/* Classer */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.crumbs span{font-size:12.5px;padding:3px 9px;background:var(--surface);border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.q-title{font-size:24px;line-height:1.15;font-weight:800}
.choice{display:grid;grid-template-columns:1fr 20px;gap:12px;align-items:center;width:100%;min-height:60px;padding:12px 16px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font-weight:600}
.choice:active{background:var(--bg)}
.choice .ui{width:18px;height:18px;color:var(--muted)}
.result{padding:20px;border-radius:20px;background:color-mix(in srgb,var(--u) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 35%,var(--surface));display:grid;gap:12px;justify-items:start}
.result .ico{width:80px;height:80px}
.result h2{font-size:26px;line-height:1.1;font-weight:800}
.surv .item{min-height:56px}

/* Quiz */
.mode{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.mode .ui{width:28px;height:28px;margin:auto}
.mode .t{font-family:var(--display);font-weight:700}
.mode .s{font-size:13px;color:var(--muted)}
.mode .b{font-family:var(--mono);font-size:13px;text-align:right}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-family:var(--mono);font-size:14px;font-weight:600}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 8px}
.track i{display:block;height:100%;background:var(--ukWh);transition:width .25s ease}
.qctx{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 8px}
.q{font-family:var(--display);font-size:21px;line-height:1.25;font-weight:700;text-wrap:pretty;margin:14px 0 16px;outline:none}
.doc.sm{margin-top:4px}
.doc.sm .drow{border-top:1px dotted var(--line);font-size:13.5px}
.doc.sm .drow span:first-child{color:var(--ink)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr 20px;gap:12px;align-items:center;width:100%;min-height:58px;padding:12px 14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.opt .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--bg);font-family:var(--mono);font-weight:600;font-size:13px}
.opt .mark{font-weight:800;text-align:center}
.opt[aria-disabled="true"]{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .mark{color:var(--good)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)} .opt.ko .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--good)}
.fb.ko{border-left-color:var(--bad)}
.fb h3{font-size:16px;margin-bottom:4px}
.dock{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:14px -16px 0;padding:12px 16px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.big{font-family:var(--mono);font-weight:600;font-size:64px;line-height:1;margin:14px 0 6px}
.big small{font-size:28px;color:var(--muted)}
.verdict{font-family:var(--display);font-size:22px;font-weight:800;margin-bottom:10px}
.miss{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.miss li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.miss b{display:block;margin-bottom:4px;font-weight:600}
.miss span{color:var(--good);font-weight:700}

/* Glossary */
.search{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 10px;background:var(--bg)}
.search label{position:relative;display:block}
.search .ui{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;min-height:48px;padding:0 14px 0 40px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
.g+ .g{border-top:1px solid var(--line)}
.g b{font-family:var(--mono);font-weight:600;font-size:14px}
.g span{font-family:var(--display);font-weight:600}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:8px 2px 6px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.tab .ui{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ukWh)}

@media (prefers-reduced-motion: reduce){.track i{transition:none}.btn:active{transform:none}}

/* Figures & small additions */
.fig .bld{fill:var(--bg);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .ln{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .ar{stroke:var(--muted);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .tx{font-size:12.5px;font-weight:700;text-anchor:middle}
.fig .tx2{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.fig .tx3{font-family:var(--mono);font-size:13px;font-weight:600;text-anchor:middle}
.fig .uL{--acc:var(--uL);color:var(--ink)} .fig .ukWh{--acc:var(--ukWh);color:var(--ink)}
.doc.sm .drow.single{justify-content:flex-start}
.doc.sm .drow.single span{color:var(--ink)!important;text-align:left}
.doc.sm header{padding-top:16px}
.hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .chip{margin-bottom:6px}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<!-- Icônes 64×64 : trait = currentColor, accent = var(--acc) -->
<symbol id="i-diesel" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<rect class="at" x="13" y="20" width="34" height="38" rx="5"/><path d="M20 20v-7h15l7 7"/><path d="M47 30h4v15h-4"/>

  var o = { id: id, th: th, q: q, o: [good].concat(bad), a: 0, e: e };
  if (extra) { for (var k in extra) { o[k] = extra[k]; } }
  WL.Q.push(o);
}
function tf(id, q, truth, e) {
  WL.Q.push({ id: id, th: "tf", q: q, o: ["Vrai", "Faux"], a: truth ? 0 : 1, fix: true, e: e });
}
function kq(id, ctx, doc, good, bad, e) {
  mc(id, "kpi", "Dans quel KPI saisis-tu cette donnée ?", WL.lab(good), bad.map(WL.lab), e, { ctx: ctx, d: doc });
}

  var pool = U4.slice(); var i = pool.indexOf(correct);
  if (i < 0) { pool.pop(); pool.unshift(correct); i = 0; }
  mc(id, "unit", q, correct, pool.filter(function (x) { return x !== correct; }).slice(0, 3), e);
}

function tr(id, term, good, bad, e) { mc(id, "trad", "Que veut dire « " + term + " » ?", good, bad, e); }

{ id: "chain", title: "La logique générale", sub: "Qualifier la donnée avant de calculer",

}
function pool(mode) {
  if (mode === "mix") { return shuffle(WL.Q.map(function (q) { return q.id; })).slice(0, 10); }
  return shuffle(WL.Q.filter(function (q) { return q.th === mode; }).map(function (q) { return q.id; }));
}
function startMode(mode) {
  var m = WL.MODES.filter(function (x) { return x.id === mode; })[0];
  start(mode, m.name, pool(mode));
}
function start(key, label, ids) {
  sess = { key: key, label: label, ids: ids, i: 0, score: 0, wrong: [], answered: false, order: null, done: false };
  renderQuestion();
}
function qDoc(q) {
  if (!q.d) { return ""; }
  return '<div class="doc sm"><header><span>' + esc(q.d[0]) + '</span><em>exemple fictif</em></header>'
    + q.d.slice(1).map(function (l) { return '<div class="drow single"><span>' + esc(l) + '</span></div>'; }).join("") + '<div class="dpad"></div></div>';
}
function renderQuestion() {
  var s = sess, q = QBY[s.ids[s.i]]; toTop(); drawTabs();
  if (!s.order) { var idx = q.o.map(function (_, i) { return i; }); s.order = q.fix ? idx : shuffle(idx); }
  var opts = s.order.map(function (oi, pos) {
    return '<li><button class="opt" data-oi="' + oi + '"><span class="ltr">' + "ABCDE"[pos] + '</span><span>' + esc(q.o[oi]) + '</span><span class="mark" aria-hidden="true"></span></button></li>';
  }).join("");
  var n = s.ids.length;
  main.innerHTML =
    '<div class="qtop"><button class="back" id="quit" aria-label="Quitter le quiz">' + ui("back") + 'Quitter</button><span class="count">' + pad(s.i + 1) + ' / ' + pad(n) + '</span></div>'
    + '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + s.i + '"><i style="width:' + Math.round(100 * s.i / n) + '%"></i></div>'
    + (q.ctx ? '<p class="qctx">' + esc(q.ctx) + '</p>' : '<p class="qctx">' + esc(s.label) + '</p>')
    + qDoc(q)
    + '<h2 class="q" id="qtext" tabindex="-1">' + esc(q.q) + '</h2>'
    + '<ul class="opts">' + opts + '</ul><div id="fb"></div><div class="dock" id="dock" hidden></div>';
  byId("quit").addEventListener("click", function () { sess = null; render(); });
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
  });
  try { byId("qtext").focus({ preventScroll: true }); } catch (e) {}
}
function answer(oi) {
  var s = sess; if (s.answered) { return; }
  s.answered = true;
  var q = QBY[s.ids[s.i]], ok = oi === q.a;
  if (ok) { s.score++; store.missed = store.missed.filter(function (id) { return id !== q.id; }); buzz(15); }
  else { s.wrong.push(q.id); if (store.missed.indexOf(q.id) < 0) { store.missed.push(q.id); } buzz([30, 40, 30]); }
  save();
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    var v = parseInt(b.getAttribute("data-oi"), 10), m = b.querySelector(".mark");
    b.setAttribute("aria-disabled", "true");
    if (v === q.a) { b.classList.add("ok"); m.textContent = "✓"; }
    else if (v === oi) { b.classList.add("ko"); m.textContent = "✗"; }
    else { b.classList.add("dim"); }
  });
  byId("fb").innerHTML = '<div class="fb' + (ok ? '' : ' ko') + '" role="status"><h3>' + (ok ? 'Juste.' : 'Raté.') + '</h3><p>' + esc(q.e) + '</p></div>';
  var last = s.i === s.ids.length - 1, dock = byId("dock");
  dock.hidden = false;
  dock.innerHTML = '<button class="btn" id="next">' + (last ? 'Voir le résultat' : 'Question suivante') + ' →</button>';
  var nb = byId("next"); nb.addEventListener("click", nextQ);
  try { nb.scrollIntoView({ block: "nearest", behavior: "smooth" }); nb.focus({ preventScroll: true }); } catch (e) {}
}
function nextQ() {
  var s = sess; s.i++; s.answered = false; s.order = null;
  if (s.i >= s.ids.length) { finish(); } else { renderQuestion(); }
}
function finish() {
  var s = sess; s.done = true;
  var n = s.ids.length;
  if (s.key !== "review") { var b = store.best[s.key]; if (!b || s.score / n > b.s / b.t) { store.best[s.key] = { s: s.score, t: n }; } }
  save(); renderResult();
}
function renderResult() {
  var s = sess, n = s.ids.length; toTop(); drawTabs();
  var r = s.score / n, verdict = r >= 0.9 ? "Solide." : r >= 0.7 ? "Bon niveau." : r >= 0.5 ? "À consolider." : "À reprendre.";
  var wrong = s.wrong.length ? '<h2 class="sec" style="margin-top:24px">À retenir</h2><ul class="miss">'
    + s.wrong.map(function (id) { var q = QBY[id]; return '<li><b>' + esc(q.q) + '</b><span>' + esc(q.o[q.a]) + '</span><p class="hint" style="margin-top:4px">' + esc(q.e) + '</p></li>'; }).join("") + '</ul>' : '';
  main.innerHTML =
    '<p class="qctx" style="margin-top:10px">' + esc(s.label) + '</p><div class="big">' + s.score + '<small> / ' + n + '</small></div><p class="verdict">' + verdict + '</p>'
    + wrong
    + '<div class="stack" style="margin-top:22px">'
    + (s.wrong.length ? '<button class="btn" id="redo">Refaire les erreurs (' + s.wrong.length + ')</button>' : '')
    + '<button class="btn' + (s.wrong.length ? ' ghost' : '') + '" id="again">Rejouer</button><button class="btn ghost" id="home">Retour aux quiz</button></div>';
  var rd = byId("redo"); if (rd) { rd.addEventListener("click", function () { start("review", "À revoir", shuffle(s.wrong)); }); }
  byId("again").addEventListener("click", function () {
    if (s.key === "review") { cleanMissed(); if (store.missed.length) { start("review", "À revoir", shuffle(store.missed)); } else { sess = null; render(); } }
    else { startMode(s.key); }
  });
  byId("home").addEventListener("click", function () { sess = null; render(); });
}

/* ---------- Glossaire ---------- */
function glossRows(qs) {
  var q = qs.trim().toLowerCase();
  var rows = WL.GLOSS.filter(function (g) { return !q || g[0].toLowerCase().indexOf(q) >= 0 || g[1].toLowerCase().indexOf(q) >= 0; });
  if (!rows.length) { return '<div class="empty">Aucun terme ne correspond.</div>'; }
  return rows.map(function (g) { return '<div class="g"><b>' + esc(g[0]) + '</b><span>' + esc(g[1]) + '</span></div>'; }).join("");
}
function renderGloss() {
  main.innerHTML =
    '<div class="page"><h1>Glossaire</h1><p class="sub">' + WL.GLOSS.length + ' termes anglais, avec leur traduction française.</p></div>'
    + '<div class="search"><label>' + ui("search") + '<input id="gq" type="search" inputmode="search" placeholder="Chercher : petrol, essence, steam…" autocomplete="off" aria-label="Chercher un terme"></label></div>'
    + '<div class="list" id="glist" style="margin-top:6px">' + glossRows("") + '</div>';
  byId("gq").addEventListener("input", function () { byId("glist").innerHTML = glossRows(this.value); });
}

/* ---------- démarrage ---------- */
var hot = window.claude && window.claude.hot;
function boot(data) {
  if (data && data.S && typeof data.S.tab === "string") {
    S.tab = data.S.tab; S.sub = data.S.sub || null; S.filter = data.S.filter || "all";
    if (data.S.cls && Array.isArray(data.S.cls.stack)) { S.cls = data.S.cls; }
    var d = data.sess;
    if (d && Array.isArray(d.ids) && d.ids.every(function (id) { return QBY[id]; })) {
      sess = d;
      if (!sess.done && sess.answered) { sess.i++; sess.answered = false; sess.order = null; if (sess.i >= sess.ids.length) { finish(); return; } }
    }
    if (S.sub && S.sub.t === "kpi" && !WL.KPI[S.sub.id]) { S.sub = null; }
    if (S.sub && S.sub.t === "lesson" && !WL.LESSONS.some(function (l) { return l.id === S.sub.id; })) { S.sub = null; }
  }
  render();
}
if (hot && typeof hot.snapshot === "function") { hot.snapshot(function () { return { S: S, sess: sess }; }); }
if (hot && typeof hot.ready === "function") { hot.ready(boot); } else { boot((hot && hot.data) || {}); }

})(window.WL);

</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
